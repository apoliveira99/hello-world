<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Starred repositories</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="page-header">
      <p class="eyebrow">Your collection</p>
      <h1>Starred repositories</h1>
      <p class="intro">A quick look at repositories worth keeping close.</p>
    </header>

    <section aria-labelledby="repositories-heading">
      <div class="section-heading">
        <h2 id="repositories-heading">Saved for later</h2>
        <span id="repository-count" class="count" aria-live="polite"></span>
      </div>
      <div id="repository-list" class="repository-list" aria-live="polite">
        <p class="status">Loading repositories…</p>
      </div>
    </section>
  </main>
</body>
</html>
